<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-acceso">

  <main class="acceso">

    <aside class="panel" aria-hidden="true">
      <p class="panel__marca">Agenda</p>
      <div class="franja">
        <div class="franja__hora"><span>08:00</span><i></i></div>
        <div class="franja__hora"><span>09:00</span><i></i></div>
        <div class="franja__hora franja__hora--tomada"><span>10:00</span><i></i></div>
        <div class="franja__hora"><span>11:00</span><i></i></div>
        <div class="franja__hora franja__hora--tomada"><span>12:00</span><i></i></div>
        <div class="franja__hora"><span>14:00</span><i></i></div>
        <div class="franja__hora"><span>15:00</span><i></i></div>
      </div>
      <p class="panel__pie">Turnos, casos y relación con el cliente en un solo lugar.</p>
    </aside>

    <section class="formulario">

      <div id="paso-credenciales">
        <header class="formulario__cabecera">
          <h1>Entrar</h1>
          <p class="apoyo">Una sola cuenta para todas tus empresas.</p>
        </header>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <p id="aviso" class="aviso" role="alert" hidden></p>

          <button type="submit" class="boton" id="btn-entrar">Entrar</button>
        </form>

        <p class="nota-pie">
          Tu sesión se guarda en una cookie que el navegador no deja leer desde JavaScript.
        </p>
      </div>

      <div id="paso-empresa" hidden>
        <header class="formulario__cabecera">
          <h1>Elige una empresa</h1>
          <p class="apoyo" id="saludo-empresa"></p>
        </header>

        <ul id="lista-empresas" class="empresas"></ul>

        <p id="aviso-empresa" class="aviso" role="alert" hidden></p>

        <button type="button" class="boton boton--texto" id="btn-cancelar">Usar otra cuenta</button>
      </div>

    </section>

  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
