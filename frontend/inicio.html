<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101c26">

  <title>Inicio · Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/movil.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <div id="cargando" class="cargando">Cargando…</div>

  <div id="contenido" hidden>
    <header class="barra">
      <p class="barra__marca">Agenda</p>
      <nav class="barra__nav">
        <a href="inicio.html">Inicio</a>
        <a href="agenda.html" id="nav-agenda" hidden>Agenda</a>
        <a href="servicios.html" id="nav-servicios" hidden>Servicios</a>
        <a href="usuarios.html" id="nav-usuarios" hidden>Personas</a>
        <a href="clientes.html" id="nav-clientes" hidden>Clientes</a>
        <a href="crm.html" id="nav-crm" hidden>CRM</a>
        <a href="equipos.html" id="nav-equipos" hidden>Equipos</a>
        <a href="configuracion.html" id="nav-config" hidden>Configuración</a>
        <a href="perfil.html">Perfil</a>
        <a href="admin.html" id="nav-admin" hidden>Plataforma</a>
      </nav>
      <div class="barra__derecha">
        <label class="visualmente-oculto" for="selector-empresa">Empresa activa</label>
        <select id="selector-empresa" class="selector"></select>
        <button type="button" class="boton boton--texto" id="btn-salir">Salir</button>
      </div>
    </header>

    <main class="tablero">

      <section class="tarjeta tarjeta--identidad">
        <h1 id="saludo">Hola</h1>
        <p class="apoyo" id="contexto"></p>
        <dl class="datos">
          <div><dt>Tus roles aquí</dt><dd id="dato-roles" class="fichas"></dd></div>
          <div><dt>Módulos activos</dt><dd id="dato-modulos" class="fichas"></dd></div>
        </dl>
      </section>

      <!-- Cada acceso aparece solo si el token trae el permiso que lo habilita -->
      <ul id="accesos" class="accesos"></ul>

    </main>
  </div>

  <script src="env.js"></script>
  <script type="module" src="js/menu.js"></script>
  <script type="module" src="js/inicio.js"></script>

</html>
