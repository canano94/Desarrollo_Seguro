<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101c26">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Agenda · Turnos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/movil.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <div id="cargando" class="cargando">Cargando la agenda…</div>

  <div id="contenido" hidden>
    <header class="barra">
      <p class="barra__marca">Agenda</p>
      <nav class="barra__nav">
        <a href="inicio.html">Inicio</a>
        <a href="agenda.html" id="nav-agenda" hidden>Agenda</a>
        <a href="servicios.html" id="nav-servicios" hidden>Servicios</a>
        <a href="usuarios.html" id="nav-usuarios" hidden>Personas</a>
        <a href="clientes.html" id="nav-clientes" hidden>Clientes</a>
        <a href="crm.html" id="nav-crm" hidden>CRM</a>
        <a href="equipos.html" id="nav-equipos" hidden>Equipos</a>
        <a href="configuracion.html" id="nav-config" hidden>Configuración</a>
        <a href="perfil.html">Perfil</a>
        <a href="admin.html" id="nav-admin" hidden>Plataforma</a>
      </nav>
      <div class="barra__derecha">
        <label class="visualmente-oculto" for="selector-empresa">Empresa activa</label>
        <select id="selector-empresa" class="selector"></select>
        <button type="button" class="boton boton--texto" id="btn-salir">Salir</button>
      </div>
    </header>

    <main class="tablero tablero--ancho">

      <!-- Pestañas principales: Turnos -->
      <div class="pestanas pestanas--grandes" role="tablist">
        <button type="button" class="pestana" role="tab" data-panel="p-turnos" aria-selected="true">Turnos</button>
      </div>

      <div id="aviso-agenda" class="aviso aviso--con-acciones" role="alert" hidden>
        <span id="aviso-texto"></span>
        <span id="aviso-acciones" class="fila-botones"></span>
      </div>

      <!-- ============ TURNOS ============ -->
      <div id="p-turnos" class="contenido-pestana">

        <!-- Sub-pestañas dentro de turnos -->
        <div class="pestanas" role="tablist">
          <button type="button" class="pestana" role="tab" data-panel="t-calendario" aria-selected="true">Calendario</button>
        </div>

        <!-- Calendario semanal -->
        <section class="tarjeta contenido-pestana" id="t-calendario">
          <div class="encabezado-seccion">
            <div>
              <h2 id="titulo-semana">Semana</h2>
              <p class="apoyo" id="subtitulo-agenda"></p>
            </div>
            <div class="calendario-controles">
              <div class="selector-vista" role="group" aria-label="Vista del calendario">
                <button type="button" class="selector-vista__boton" data-vista="dia" aria-pressed="false">Día</button>
                <button type="button" class="selector-vista__boton" data-vista="semana" aria-pressed="true">Semana</button>
                <button type="button" class="selector-vista__boton" data-vista="mes" aria-pressed="false">Mes</button>
              </div>
              <div class="fila-botones">
                <button type="button" class="boton boton--borde boton--mini" id="btn-semana-anterior" aria-label="Anterior">←</button>
                <button type="button" class="boton boton--borde boton--mini" id="btn-hoy">Hoy</button>
                <button type="button" class="boton boton--borde boton--mini" id="btn-semana-siguiente" aria-label="Siguiente">→</button>
              </div>
            </div>
          </div>

          <div class="calendario-envoltura">
            <div class="calendario" id="calendario"></div>
          </div>

          <!-- Detalle del turno seleccionado: acciones y observaciones -->
          <div id="detalle-turno" class="detalle-turno" hidden>
            <div class="detalle-turno__cabecera">
              <div>
                <strong id="dt-servicio"></strong>
                <span class="apoyo" id="dt-info"></span>
              </div>
              <button type="button" class="boton boton--texto" id="dt-cerrar">Cerrar</button>
            </div>

            <div class="fila-botones" id="dt-acciones"></div>

            <div id="dt-reprogramar" class="fila-form" hidden>
              <div class="campo">
                <label for="dt-fecha">Nueva fecha y hora</label>
                <input id="dt-fecha" type="datetime-local">
              </div>
              <button type="button" class="boton boton--mini" id="dt-guardar-fecha">Reprogramar</button>
            </div>

            <div id="dt-observaciones-caja" hidden>
              <h3 class="subtitulo">Observaciones</h3>
              <ul id="dt-observaciones" class="observaciones"></ul>
              <div class="fila-form">
                <div class="campo">
                  <label for="dt-nota">Nueva observación</label>
                  <input id="dt-nota" type="text" maxlength="1000">
                </div>
                <button type="button" class="boton boton--mini" id="dt-guardar-nota">Agregar</button>
              </div>
            </div>
          </div>

          <!-- Reservar en tres pasos: servicio, día, hora libre -->
          <div id="reservar" class="reservar" hidden>
            <h3 class="subtitulo">Reservar un turno</h3>

            <!-- Cliente: solo lo ve quien agenda a nombre de otros.
                 Es un buscador y no un desplegable: con cientos de clientes
                 una lista es inusable y obligaría a traerlos todos. -->
            <div class="campo" id="campo-cliente" hidden>
              <label for="r-cliente-busca">Cliente</label>
              <div id="r-cliente-elegido-caja" class="cliente-elegido" hidden>
                <input id="r-cliente-elegido" type="text" readonly class="entrada entrada--elegido">
                <button type="button" class="boton boton--texto boton--mini" id="r-cliente-cambiar">Cambiar</button>
              </div>
              <input id="r-cliente-busca" type="search" maxlength="80"
                     placeholder="Nombre, documento, correo o teléfono" autocomplete="off">
              <ul id="r-cliente-resultados" class="resultados" hidden></ul>
              <p class="pista" id="r-cliente-pista">¿Es un cliente nuevo? <a href="clientes.html">Créalo en Clientes</a> y vuelve a agendar.</p>
            </div>

            <div class="fila-form">
              <div class="campo">
                <label for="r-servicio">1. Servicio</label>
                <select id="r-servicio" class="entrada"></select>
              </div>
              <div class="campo">
                <label for="r-dia">2. Día</label>
                <input id="r-dia" type="date" class="entrada">
              </div>
            </div>

            <p class="apoyo" id="r-paso3">3. Elige una hora disponible</p>
            <div id="r-horas" class="horas"></div>
          </div>

        </section>
      </div>

    </main>
  </div>

  <script type="module" src="js/menu.js"></script>
  <script type="module" src="js/agenda.js"></script>
</body>
</html>
