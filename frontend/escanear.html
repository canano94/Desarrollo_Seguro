<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101c26">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Escanear QR · Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/equipos.css">
  <link rel="stylesheet" href="css/movil.css">
</head>
<body>
  <div id="cargando" class="cargando">Cargando…</div>

  <div id="contenido" hidden>
    <header class="barra">
      <p class="barra__marca">Agenda</p>
      <nav class="barra__nav">
        <a href="inicio.html">Inicio</a>
        <a href="agenda.html" id="nav-agenda" hidden>Agenda</a>
        <a href="servicios.html" id="nav-servicios" hidden>Servicios</a>
        <a href="usuarios.html" id="nav-usuarios" hidden>Personas</a>
        <a href="clientes.html" id="nav-clientes" hidden>Clientes</a>
        <a href="crm.html" id="nav-crm" hidden>CRM</a>
        <a href="equipos.html" id="nav-equipos" hidden>Equipos</a>
        <a href="configuracion.html" id="nav-config" hidden>Configuración</a>
        <a href="perfil.html">Perfil</a>
        <a href="admin.html" id="nav-admin" hidden>Plataforma</a>
      </nav>
      <div class="barra__derecha">
        <button type="button" class="boton boton--texto" id="btn-salir">Salir</button>
      </div>
    </header>

    <main class="tablero">
      <a href="inicio.html" class="volver" id="volver">← Inicio</a>
      <h1>Escanear código QR</h1>
      <p class="apoyo">Apunta la cámara a la etiqueta del equipo. Se abre solo al reconocerla.</p>

      <p id="aviso" class="aviso" role="alert" hidden></p>

      <!-- Visor de la cámara. El video nunca sale del celular: se analiza
           cuadro por cuadro en el navegador, no se envía al servidor. -->
      <div class="escaner" id="escaner">
        <video id="video" class="escaner__video" playsinline muted></video>
        <div class="escaner__marco" aria-hidden="true"></div>
        <p class="escaner__estado" id="estado" role="status">Pidiendo permiso para usar la cámara…</p>
      </div>

      <div class="fila-botones escaner__acciones">
        <button type="button" class="boton" id="btn-camara" hidden>Activar cámara</button>
        <button type="button" class="boton boton--borde" id="btn-linterna" hidden>Encender linterna</button>
        <!-- Plan B: si la cámara en vivo no funciona, se toma una foto con
             la cámara del sistema y se lee el código de la imagen. -->
        <label class="boton boton--texto escaner__foto" for="foto">Leer desde una foto</label>
        <input id="foto" type="file" accept="image/*" capture="environment" class="visualmente-oculto">
      </div>

      <canvas id="lienzo" hidden></canvas>
    </main>
  </div>

  <script src="env.js"></script>
  <script type="module" src="js/menu.js"></script>
  <!-- jsQR: lector de QR para navegadores sin BarcodeDetector (iPhone, Firefox). -->
  <script src="js/vendor/jsQR.js"></script>
  <script type="module" src="js/escanear.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
